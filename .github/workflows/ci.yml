name: 3X CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Tolk Smart Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Acton Toolchain
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0

      - name: Format Check
        run: acton fmt --check

      - name: Check Tolk Sources
        run: acton check --output-format github

      - name: Build Tolk Contracts
        run: acton build

      - name: Run TVM Emulator Tests
        run: acton test

  frontend-and-ledger:
    name: Frontend & Economic Ledger
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck / Lint
        run: pnpm run lint

      - name: Run Domain & Ledger Unit Tests
        run: pnpm test

      - name: Build Frontend Production Bundle
        run: pnpm run build

