[package]
name = "3x-contracts"
description = "3X Living Agent Protocol Smart Contracts in Tolk"
version = "0.1.0"
license = "MIT"

[toolchain]
acton = "1.1.0"

[contracts.ThreeXJettonWallet]
display-name = "ThreeXJettonWallet"
src = "contracts/jetton/ThreeXJettonWallet.tolk"
depends = []

[contracts.ThreeXJettonMinter]
display-name = "ThreeXJettonMinter"
src = "contracts/jetton/ThreeXJettonMinter.tolk"
depends = ["ThreeXJettonWallet"]

[contracts.AIReserveVault]
display-name = "AIReserveVault"
src = "contracts/reserve/AIReserveVault.tolk"
depends = []

[contracts.EmissionController]
display-name = "EmissionController"
src = "contracts/emission/EmissionController.tolk"
depends = []

[contracts.TeamUnlockVault]
display-name = "TeamUnlockVault"
src = "contracts/team/TeamUnlockVault.tolk"
depends = []

[test]

[fmt]
width = 100
ignore = []

[import-mappings]
acton = ".acton"
contracts = "contracts"
gen = "gen"
tests = "tests"
wrappers = "wrappers"
